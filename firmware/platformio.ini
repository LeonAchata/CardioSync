; CardioSync firmware - PlatformIO configuration
; https://docs.platformio.org/page/projectconf.html
;
; Before building, create:
;   include/wifi_config.h  (copy include/wifi_config.example.h)
;   include/aws_config.h   (generated by `terraform apply` in infra/terraform,
;                           or copy include/aws_config.example.h and fill it in)

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
	-Wall
lib_deps =
	thexspaceacademy/XSpaceBioV10@^1.0.6
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^6.21.3
	adafruit/Adafruit SSD1306@^2.5.7
	adafruit/Adafruit GFX Library@^1.11.3
; Uncomment and adjust if auto-detection picks the wrong port
; upload_port = COM3
; monitor_port = COM3

; Headless build: capture + upload, logs over serial
[env:esp32dev]

; Same firmware with the SSD1306 OLED status screen enabled
[env:esp32dev-display]
build_flags =
	${env.build_flags}
	-D CARDIOSYNC_ENABLE_DISPLAY
